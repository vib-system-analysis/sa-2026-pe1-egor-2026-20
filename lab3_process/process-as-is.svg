<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" role="img" aria-labelledby="title description">
  <title id="title">Предварительная BPMN-модель первичной оценки симптома растения</title>
  <desc id="description">Реконструкция текущего процесса по материалам лабораторных 1 и 2. Проверка снимка и консультация с сотрудником питомника отмечены как требующие проверки.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .lane-label { font-size: 15px; font-weight: 700; }
      .task-text { font-size: 14px; text-anchor: middle; }
      .small { font-size: 12px; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .task { fill: #fff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .hypothesis { fill: #fffdf5; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 4; rx: 12; }
      .hypothesis-gateway { fill: #fffdf5; stroke: #d97706; stroke-width: 2; stroke-dasharray: 5 3; }
    </style>
  </defs>
  <rect width="1700" height="930" fill="#f8fafc"/>
  <text class="title" x="80" y="48">Первичная оценка симптомов растений по фото — as-is</text>
  <text class="subtitle" x="80" y="76">Предварительная реконструкция по 3 описанным эпизодам; не подтверждённый регламент или полный наблюдённый маршрут</text>

  <rect x="80" y="100" width="1590" height="700" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="80" y="100" width="1590" height="300" fill="#eff6ff"/>
  <rect x="80" y="400" width="1590" height="180" fill="#f0fdf4"/>
  <rect x="80" y="580" width="1590" height="220" fill="#fffbeb"/>
  <line x1="80" y1="400" x2="1670" y2="400" stroke="#94a3b8"/>
  <line x1="80" y1="580" x2="1670" y2="580" stroke="#94a3b8"/>
  <line x1="110" y1="100" x2="110" y2="800" stroke="#94a3b8"/>
  <text class="lane-label" transform="translate(101 370) rotate(-90)">Садовод / работник</text>
  <text class="lane-label" transform="translate(101 555) rotate(-90)">Приложение</text>
  <text class="lane-label" transform="translate(101 785) rotate(-90)">Сотрудник питомника</text>

  <!-- Sequence flows -->
  <path class="flow" d="M196 243 H230"/>
  <path class="flow" d="M380 243 H420"/>
  <path class="flow" d="M575 243 H680"/>
  <path class="flow" d="M650 341 H500 V278"/>
  <path class="flow" d="M757 278 V485 H900"/>
  <path class="flow" d="M1095 485 H1122 V278"/>
  <path class="flow" d="M1325 243 H1370"/>
  <path class="flow" d="M1420 243 L1460 223"/>
  <text class="small" x="1422" y="205">да</text>
  <path class="flow" d="M1395 268 V341 H840"/>
  <text class="small" x="1090" y="331">нужен снимок получше</text>
  <path class="flow" d="M1395 268 V620"/>
  <text class="small" x="1405" y="300">нет / нужно уточнить</text>
  <path class="flow" d="M1300 655 H1270"/>
  <path class="flow" d="M1080 655 H1045 V243 H1120"/>
  <path class="flow" d="M1610 223 H1618"/>

  <!-- Nodes -->
  <circle cx="178" cy="243" r="18" fill="#fff" stroke="#15803d" stroke-width="3"/>
  <text class="small" x="178" y="285" text-anchor="middle">Симптом замечен</text>
  <rect class="task" x="230" y="208" width="150" height="70"/>
  <text class="task-text" x="305" y="237"><tspan x="305">Определить,</tspan><tspan x="305" dy="18">что беспокоит</tspan></text>
  <rect class="task" x="420" y="208" width="155" height="70"/>
  <text class="task-text" x="497" y="237"><tspan x="497">Сфотографировать</tspan><tspan x="497" dy="18">растение / симптом</tspan></text>
  <rect class="task" x="650" y="310" width="190" height="62"/>
  <text class="task-text" x="745" y="336"><tspan x="745">Изменить кадр</tspan><tspan x="745" dy="18">или условия; переснять</tspan></text>
  <rect class="task" x="680" y="208" width="155" height="70"/>
  <text class="task-text" x="757" y="237"><tspan x="757">Передать снимок</tspan><tspan x="757" dy="18">в приложение</tspan></text>
  <rect class="task" x="900" y="448" width="195" height="74"/>
  <text class="task-text" x="997" y="476"><tspan x="997">Получить</tspan><tspan x="997" dy="18">предварительную</tspan><tspan x="997" dy="18">классификацию</tspan></text>
  <rect class="hypothesis" x="1120" y="208" width="205" height="70"/>
  <text class="task-text" x="1222" y="233"><tspan x="1222">Оценить вывод с учётом</tspan><tspan x="1222" dy="18">растения, условий</tspan><tspan x="1222" dy="18">и ограничений снимка</tspan></text>
  <polygon class="hypothesis-gateway" points="1395,218 1420,243 1395,268 1370,243"/>
  <path d="M1388 236 L1402 250 M1402 236 L1388 250" fill="none" stroke="#b45309" stroke-width="2"/>
  <text class="small" x="1395" y="188" text-anchor="middle">Можно выбрать шаг?</text>
  <rect class="hypothesis" x="1460" y="185" width="150" height="76"/>
  <text class="task-text" x="1535" y="211"><tspan x="1535">Выбрать шаг</tspan><tspan x="1535" dy="18">или обозначить</tspan><tspan x="1535" dy="18">неопределённость</tspan></text>
  <circle cx="1636" cy="223" r="18" fill="#fff" stroke="#b91c1c" stroke-width="4"/>
  <circle cx="1636" cy="223" r="13" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text class="small" x="1627" y="260" text-anchor="end">Следующий шаг выбран</text>
  <rect class="hypothesis" x="1300" y="620" width="170" height="70"/>
  <text class="task-text" x="1385" y="647"><tspan x="1385">Уточнить ситуацию</tspan><tspan x="1385" dy="18">у сотрудника питомника</tspan></text>
  <rect class="hypothesis" x="1080" y="620" width="190" height="70"/>
  <text class="task-text" x="1175" y="647"><tspan x="1175">Добавить сведения;</tspan><tspan x="1175" dy="18">повторно оценить гипотезу</tspan></text>

  <rect x="80" y="825" width="1570" height="75" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <rect x="105" y="847" width="28" height="20" class="task"/>
  <text class="small" x="143" y="862">Действие прямо упомянуто в эпизоде</text>
  <rect x="420" y="847" width="28" height="20" class="hypothesis"/>
  <text class="small" x="458" y="862">Реконструкция / требует проверки</text>
  <text class="small" x="750" y="853">Повторная съёмка после неудовлетворительного результата описана в одном эпизоде.</text>
  <text class="small" x="750" y="873">Правило оценки достаточности данных и маршрут к сотруднику не подтверждены.</text>
</svg>
